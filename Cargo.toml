[package]
name = "tree-sitter-metamath-zero"
description = "A parser for the Metamath Zero language"
version = "0.1.0"
authors = ["Daria Sukhonina <dariasukhonina@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "metamath-zero"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/zetanumbers/tree-sitter-mm0"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.6"
